<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="506" viewBox="0 0 1280 506" role="img" aria-labelledby="title desc">
<title id="title">How an audit runs</title>
<desc id="desc">Seven read-only steps: scope, recon, model, lenses, disprove, rank, validate; the report is saved to docs/audits. Fix mode, only on request: reproduce, smallest fix, prove it, hand over risky steps, record the status.</desc>
<rect width="1280" height="506" rx="16" fill="#161b22" stroke="#30363d"/><text x="40.0" y="56.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#f0f6fc" text-anchor="start">How an audit runs</text><text x="40.0" y="84.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8b949e" text-anchor="start">Read-only. Nothing in your system changes, apart from the saved report.</text><rect x="40" y="112" width="158" height="128" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><circle cx="64" cy="138" r="13" fill="#3987e5"/><text x="64.0" y="143.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="84.0" y="143.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f0f6fc" text-anchor="start">Scope</text><text x="56.0" y="172.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" text-anchor="start">Pin the branch and</text><text x="56.0" y="191.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" text-anchor="start">commit. Choose quick,</text><text x="56.0" y="210.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" text-anchor="start">standard or deep.</text><line x1="200" y1="176" x2="208" y2="176" stroke="#8b949e" stroke-width="2"/><path d="M214,176 l-8,-5 v10 z" fill="#8b949e"/><rect x="216" y="112" width="158" height="128" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><circle cx="240" cy="138" r="13" fill="#3987e5"/><text x="240.0" y="143.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="260.0" y="143.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f0f6fc" text-anchor="start">Recon</text><text x="232.0" y="172.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" text-anchor="start">recon.py maps the</text><text x="232.0" y="191.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" text-anchor="start">stack, processes, jobs</text><text x="232.0" y="210.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" text-anchor="start">and risk signals.</text><line x1="376" y1="176" x2="384" y2="176" stroke="#8b949e" stroke-width="2"/><path d="M390,176 l-8,-5 v10 z" fill="#8b949e"/><rect x="392" y="112" width="158" height="128" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><circle cx="416" cy="138" r="13" fill="#3987e5"/><text x="416.0" y="143.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="436.0" y="143.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f0f6fc" text-anchor="start">Model</text><text x="408.0" y="172.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" text-anchor="start">Components, data</text><text x="408.0" y="191.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" text-anchor="start">flow, critical paths,</text><text x="408.0" y="210.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" text-anchor="start">binding constraint.</text><line x1="552" y1="176" x2="560" y2="176" stroke="#8b949e" stroke-width="2"/><path d="M566,176 l-8,-5 v10 z" fill="#8b949e"/><rect x="568" y="112" width="158" height="128" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><circle cx="592" cy="138" r="13" fill="#3987e5"/><text x="592.0" y="143.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="612.0" y="143.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f0f6fc" text-anchor="start">Lenses</text><text x="584.0" y="172.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" text-anchor="start">10 lenses and 27</text><text x="584.0" y="191.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" text-anchor="start">failure patterns from</text><text x="584.0" y="210.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" text-anchor="start">real incidents.</text><line x1="728" y1="176" x2="736" y2="176" stroke="#8b949e" stroke-width="2"/><path d="M742,176 l-8,-5 v10 z" fill="#8b949e"/><rect x="744" y="112" width="158" height="128" rx="12" fill="#0d1117" stroke="#3987e5" stroke-width="2"/><circle cx="768" cy="138" r="13" fill="#3987e5"/><text x="768.0" y="143.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="788.0" y="143.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f0f6fc" text-anchor="start">Disprove</text><text x="760.0" y="172.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" text-anchor="start">Hunt for the guard.</text><text x="760.0" y="191.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" text-anchor="start">Write the trigger,</text><text x="760.0" y="210.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" text-anchor="start">mechanism, impact.</text><line x1="904" y1="176" x2="912" y2="176" stroke="#8b949e" stroke-width="2"/><path d="M918,176 l-8,-5 v10 z" fill="#8b949e"/><rect x="920" y="112" width="158" height="128" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><circle cx="944" cy="138" r="13" fill="#3987e5"/><text x="944.0" y="143.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text x="964.0" y="143.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f0f6fc" text-anchor="start">Rank</text><text x="936.0" y="172.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" text-anchor="start">Critical, Normal or</text><text x="936.0" y="191.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" text-anchor="start">Good Practice, plus</text><text x="936.0" y="210.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" text-anchor="start">a confidence level.</text><line x1="1080" y1="176" x2="1088" y2="176" stroke="#8b949e" stroke-width="2"/><path d="M1094,176 l-8,-5 v10 z" fill="#8b949e"/><rect x="1096" y="112" width="158" height="128" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><circle cx="1120" cy="138" r="13" fill="#3987e5"/><text x="1120.0" y="143.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">7</text><text x="1140.0" y="143.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f0f6fc" text-anchor="start">Validate</text><text x="1112.0" y="172.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" text-anchor="start">Every cited file:line</text><text x="1112.0" y="191.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" text-anchor="start">checked. No secrets.</text><text x="1112.0" y="210.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" text-anchor="start">Report saved.</text><rect x="40" y="266" width="1200" height="52" rx="10" fill="#0f2742" stroke="#3987e5"/><text x="60.0" y="298.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#3987e5" text-anchor="start">Output</text><text x="130.0" y="298.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="600" fill="#f0f6fc" text-anchor="start">docs/audits/system-design-audit-YYYY-MM-DD.md</text><text x="560.0" y="298.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">Summary · System map · Scorecard · Findings · Strengths · Open questions · Plan</text><text x="40.0" y="358.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f0f6fc" text-anchor="start">Fix mode</text><text x="150.0" y="358.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8b949e" text-anchor="start">Only when you ask. One finding at a time, with proof.</text><rect x="40" y="380" width="220" height="104" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><circle cx="64" cy="406" r="13" fill="#3987e5"/><text x="64.0" y="411.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="84.0" y="411.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f0f6fc" text-anchor="start">Reproduce</text><text x="56.0" y="440.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" text-anchor="start">Write a test that fails</text><text x="56.0" y="459.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" text-anchor="start">for the reason given.</text><line x1="262" y1="432" x2="277" y2="432" stroke="#8b949e" stroke-width="2"/><path d="M283,432 l-8,-5 v10 z" fill="#8b949e"/><rect x="285" y="380" width="220" height="104" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><circle cx="309" cy="406" r="13" fill="#3987e5"/><text x="309.0" y="411.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="329.0" y="411.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f0f6fc" text-anchor="start">Smallest fix</text><text x="301.0" y="440.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" text-anchor="start">Match the code's style.</text><text x="301.0" y="459.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" text-anchor="start">No drive-by refactors.</text><line x1="507" y1="432" x2="522" y2="432" stroke="#8b949e" stroke-width="2"/><path d="M528,432 l-8,-5 v10 z" fill="#8b949e"/><rect x="530" y="380" width="220" height="104" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><circle cx="554" cy="406" r="13" fill="#3987e5"/><text x="554.0" y="411.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="574.0" y="411.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f0f6fc" text-anchor="start">Prove it</text><text x="546.0" y="440.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" text-anchor="start">Test passes, full suite</text><text x="546.0" y="459.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" text-anchor="start">green, nothing weakened.</text><line x1="752" y1="432" x2="767" y2="432" stroke="#8b949e" stroke-width="2"/><path d="M773,432 l-8,-5 v10 z" fill="#8b949e"/><rect x="775" y="380" width="220" height="104" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><circle cx="799" cy="406" r="13" fill="#3987e5"/><text x="799.0" y="411.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="819.0" y="411.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f0f6fc" text-anchor="start">Hand over</text><text x="791.0" y="440.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" text-anchor="start">Migrations, deploys and</text><text x="791.0" y="459.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" text-anchor="start">secrets wait for you.</text><line x1="997" y1="432" x2="1012" y2="432" stroke="#8b949e" stroke-width="2"/><path d="M1018,432 l-8,-5 v10 z" fill="#8b949e"/><rect x="1020" y="380" width="220" height="104" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><circle cx="1044" cy="406" r="13" fill="#3987e5"/><text x="1044.0" y="411.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="1064.0" y="411.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f0f6fc" text-anchor="start">Record</text><text x="1036.0" y="440.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" text-anchor="start">Report status updated:</text><text x="1036.0" y="459.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" text-anchor="start">Fixed, with the test.</text>
</svg>
