<title id="title">Example report</title>
<desc id="desc">Excerpt of a real report the skill wrote for the shop-orders test system: a verdict, 7 Critical, 5 Normal and 3 Good Practice findings, and a findings table with severity, confidence, title and file:line evidence.</desc>
