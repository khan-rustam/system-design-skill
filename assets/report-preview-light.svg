idth="70.0" height="23" rx="11.5" fill="#cf222e"/><text x="183.0" y="504.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Critical</text><text x="288.0" y="506.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#57606a" text-anchor="start">Likely</text><text x="392.0" y="506.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">Unpaid orders hold their stock forever</text><text x="900.0" y="506.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#2a78d6" text-anchor="start">app/routes/orders.py:35-48</text><line x1="32" y1="520" x2="1248" y2="520" stroke="#eaeef2"/><text x="48.0" y="546.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">SDA-006</text><rect x="148.0" y="529.0" width="70.0" height="23" rx="11.5" fill="#cf222e"/><text x="183.0" y="544.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Critical</text><text x="288.0" y="546.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#57606a" text-anchor="start">Confirmed</text><text x="392.0" y="546.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">Nightly job inflates sold_count eight times a night</text><text x="900.0" y="546.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" 