firmed</text><text x="392.0" y="626.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">Float arithmetic undercharges ~10% of price/qty pairs by a cent</text><text x="900.0" y="626.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#2a78d6" text-anchor="start">app/services/paygate.py:17</text><line x1="32" y1="640" x2="1248" y2="640" stroke="#eaeef2"/><text x="48.0" y="666.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">SDA-013</text><rect x="148.0" y="649.0" width="109.6" height="23" rx="11.5" fill="#1a7f37"/><text x="202.8" y="664.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Good Practice</text><text x="288.0" y="666.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#57606a" text-anchor="start">Confirmed</text><text x="392.0" y="666.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">Order history has no limit</text><text x="900.0" y="666.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#2a78d6" text-anchor="start">app/routes/orders.py:52-61</text><text x="48.0" y="714.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6e7781" text-anchor="start">+ 6 more findings, each with evidence, a failure scenario, a fix, effort and a test to verify it.</text><text x="48.0" y="738.0" font-family="-apple-system, Bl